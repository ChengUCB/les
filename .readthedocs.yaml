# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py

# Only the Sphinx toolchain is installed. The docs use no autodoc, so nequip-les
# and torch are not needed to build them -- which keeps the build inside Read the
# Docs' time and memory limits.
python:
  install:
    - requirements: docs/requirements.txt
